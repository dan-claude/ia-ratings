[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = [
  "pip install -r server/requirements.txt",
  "cd client && npm install"
]

[phases.build]
cmds = ["cd client && npm run build"]

[start]
cmd = "PYTHONPATH=. python -m server.app --no-debug --with-client --host 0.0.0.0 --port $PORT"
